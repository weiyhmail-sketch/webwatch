<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebWatch 下单面板</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2029; --line:#2a323d; --txt:#e6e6e6; --muted:#8a94a3;
          --green:#26a65b; --red:#e0533d; --amber:#e0a93d; --accent:#3d7be0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px;
           background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .badge { padding:3px 10px; border-radius:4px; font-weight:700; letter-spacing:.5px; }
  .badge.paper { background:var(--green); color:#fff; }
  .badge.live  { background:var(--red); color:#fff; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; }
  .dot.on { background:var(--green); } .dot.off { background:var(--red); }
  .acct { color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
  .acct b { color:var(--txt); }
  main { padding:16px; display:grid; gap:16px; grid-template-columns:1fr 1fr; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .card h2 { margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase;
             letter-spacing:.5px; }
  .full { grid-column:1 / -1; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:right; padding:6px 8px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  tbody tr:hover { background:#222b36; }
  .pos { color:var(--green); } .neg { color:var(--red); } .mut { color:var(--muted); }
  input,button { font:inherit; }
  input { background:#0f1419; border:1px solid var(--line); color:var(--txt);
          padding:6px 8px; border-radius:4px; width:120px; text-transform:uppercase; }
  button { background:var(--accent); border:0; color:#fff; padding:6px 12px;
           border-radius:4px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
  button:hover { filter:brightness(1.1); }
  .err { color:var(--amber); font-size:12px; }
  .x { color:var(--muted); cursor:pointer; }
  .empty { color:var(--muted); padding:8px; }
  #livebar { display:none; padding:8px 16px; font-weight:700; text-align:center; }
  #livebar.live { display:block; background:var(--red); color:#fff;
                  letter-spacing:1px; animation:pulse 1.5s infinite; }
  #livebar.warn { display:block; background:var(--amber); color:#1a1a1a; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }
  .orderform { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .orderform label { color:var(--muted); display:flex; align-items:center; gap:4px; }
  .orderform select { background:#0f1419; border:1px solid var(--line); color:var(--txt);
                      padding:6px 4px; border-radius:4px; }
  .orderform input { width:90px; }
  #buyBtn { background:var(--green); font-weight:700; }
  .orderresult { margin-top:10px; font-size:13px; min-height:18px; }
</style>
</head>
<body>
<header>
  <span id="env" class="badge paper">PAPER</span>
  <span><span id="dot" class="dot off"></span><span id="conn">未连接</span></span>
  <span id="session" class="badge" style="background:#2a323d;color:var(--txt)"></span>
  <div class="acct" id="acct"></div>
  <span style="flex:1"></span>
  <span class="err" id="err"></span>
  <button class="ghost" id="cancelAllBtn" title="c">撤全部挂单</button>
  <button id="flattenBtn" style="background:var(--red)" title="f">市价全平</button>
  <button class="ghost" id="reconnect">重连</button>
</header>
<div id="livebar"></div>

<main>
  <section class="card full">
    <h2>下单 — 买入同时自动挂止盈止损</h2>
    <div class="orderform">
      <input id="oSym" placeholder="代码" style="width:100px" />
      <input id="oQty" type="number" value="100" placeholder="数量" style="width:80px" />
      <input id="oEntry" type="number" step="0.01" placeholder="限价/市价参考价" style="width:130px" />
      <label>止盈
        <select id="oTpKind">
          <option value="pct">%</option>
          <option value="price_offset">+$/股</option>
          <option value="profit_usd">盈利$</option>
        </select>
        <input id="oTpVal" value="0.002" />
      </label>
      <label>止损
        <select id="oSlKind">
          <option value="pct">%</option>
          <option value="price_offset">-$/股</option>
          <option value="profit_usd">亏损$</option>
        </select>
        <input id="oSlVal" value="0.004" />
      </label>
      <button id="previewBtn" class="ghost">预览</button>
      <button id="buyBtn">限价买入</button>
      <button id="buyMktBtn" style="background:var(--amber)">市价买入</button>
    </div>
    <div class="mut" style="font-size:12px;margin-top:6px;">
      限价买入：用上方价格作母单限价，三单同时挂（零空窗）。
      市价买入：以市价成交，用<b>真实成交价</b>算止盈止损，上方价格仅作风控/预览参考价。
    </div>
    <div class="orderresult" id="orderResult"></div>
  </section>

  <section class="card full">
    <h2>报价 (watchlist)</h2>
    <div style="margin-bottom:10px; display:flex; align-items:center; gap:10px;">
      <input id="symInput" placeholder="代码 如 AAPL" />
      <button id="addBtn">添加</button>
      <label class="mut" style="display:flex; align-items:center; gap:4px;">行情类型
        <select id="mdtype">
          <option value="1">实时</option>
          <option value="2">冻结</option>
          <option value="3">延迟</option>
          <option value="4">延迟冻结</option>
        </select>
      </label>
      <span class="mut" style="font-size:12px;">实时被占用(10197)时切「延迟」可看免费行情</span>
    </div>
    <table>
      <thead><tr><th>代码</th><th>买一</th><th>卖一</th><th>最新</th><th>昨收</th><th></th></tr></thead>
      <tbody id="quotes"><tr><td colspan="6" class="empty">还没有关注的标的</td></tr></tbody>
    </table>
  </section>

  <section class="card">
    <h2>持仓</h2>
    <table>
      <thead><tr><th>代码</th><th>方向</th><th>数量</th><th>均价</th><th>现价</th><th>浮盈</th></tr></thead>
      <tbody id="positions"><tr><td colspan="6" class="empty">无持仓</td></tr></tbody>
    </table>
  </section>

  <section class="card">
    <h2>挂单</h2>
    <table>
      <thead><tr><th>代码</th><th>方向</th><th>类型</th><th>数量</th><th>限价</th><th>止损价</th><th>状态</th></tr></thead>
      <tbody id="orders"><tr><td colspan="7" class="empty">无挂单</td></tr></tbody>
    </table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let isLive = false;  // 由 render() 根据 state 更新；下单确认用
let isRth = true;    // 是否常规盘；时段外市价会转激进限价
let sessionLabel = '';
const fmt = (v, d=2) => (v === null || v === undefined) ? '<span class="mut">—</span>' : Number(v).toFixed(d);
const money = (v) => (v === null || v === undefined) ? '—' : Number(v).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
const sideCls = (s) => s === 'long' ? 'pos' : 'neg';

function render(st) {
  // 环境 + 连接
  const env = $('env');
  env.textContent = (st.environment || 'paper').toUpperCase();
  env.className = 'badge ' + (st.environment === 'live' ? 'live' : 'paper');
  $('dot').className = 'dot ' + (st.connected ? 'on' : 'off');
  $('conn').textContent = st.connected ? '已连接' : '未连接';
  // LIVE 醒目横幅 / 互锁回退警告
  isLive = !!st.is_live;
  const bar = $('livebar');
  if (isLive) { bar.className = 'live'; bar.textContent = '🔴 LIVE 实盘 — 真金白银，每笔下单都会用真实资金成交'; }
  else if (st.env_warning) { bar.className = 'warn'; bar.textContent = '⚠ ' + st.env_warning; }
  else { bar.className = ''; bar.textContent = ''; }
  $('err').textContent = st.error ? ('⚠ ' + st.error) : '';
  if (document.activeElement !== $('mdtype')) $('mdtype').value = String(st.market_data_type || 1);
  // 交易时段
  isRth = !!st.is_rth;
  sessionLabel = st.session || '';
  const sEl = $('session');
  sEl.textContent = sessionLabel ? ('时段:' + sessionLabel) : '';
  sEl.style.background = isRth ? 'var(--green)' : (sessionLabel === '休市' ? '#555' : 'var(--amber)');
  sEl.style.color = isRth ? '#fff' : (sessionLabel === '休市' ? '#fff' : '#1a1a1a');

  // 账户
  const a = st.account;
  $('acct').innerHTML = a ? `
    <span>账户 <b>${a.account}</b></span>
    <span>净值 <b>${money(a.net_liquidation)}</b></span>
    <span>现金 <b>${money(a.total_cash_value)}</b></span>
    <span>购买力 <b>${money(a.buying_power)}</b></span>` : '<span class="mut">账户数据不可用</span>';

  // 报价
  const q = $('quotes');
  q.innerHTML = (st.quotes && st.quotes.length) ? st.quotes.map(r => {
    const tag = r.data_type ? `<span class="mut" style="font-size:11px"> ${r.data_type}</span>` : '';
    return `<tr><td>${r.symbol}${tag}</td><td>${fmt(r.bid)}</td><td>${fmt(r.ask)}</td>
    <td>${fmt(r.last)}</td><td>${fmt(r.close)}</td>
    <td class="x" onclick="unwatch('${r.symbol}')">✕</td></tr>`;
  }).join('')
    : '<tr><td colspan="6" class="empty">还没有关注的标的</td></tr>';

  // 持仓
  const p = $('positions');
  p.innerHTML = (st.positions && st.positions.length) ? st.positions.map(r => {
    const pnl = r.unrealized_pnl;
    const cls = pnl === null ? 'mut' : (pnl >= 0 ? 'pos' : 'neg');
    return `<tr><td>${r.symbol}</td><td class="${sideCls(r.side)}">${r.side}</td>
    <td>${r.quantity}</td><td>${fmt(r.avg_entry_price)}</td><td>${fmt(r.mark_price)}</td>
    <td class="${cls}">${pnl === null ? '—' : money(pnl)}</td></tr>`;
  }).join('') : '<tr><td colspan="6" class="empty">无持仓</td></tr>';

  // 挂单
  const o = $('orders');
  o.innerHTML = (st.orders && st.orders.length) ? st.orders.map(r => `
    <tr><td>${r.symbol}</td><td class="${sideCls(r.side)}">${r.side}</td><td>${r.order_type}</td>
    <td>${r.quantity}</td><td>${fmt(r.limit_price)}</td><td>${fmt(r.stop_price)}</td>
    <td>${r.status}</td></tr>`).join('')
    : '<tr><td colspan="7" class="empty">无挂单</td></tr>';
}

async function addWatch() {
  const sym = $('symInput').value.trim();
  if (!sym) return;
  $('symInput').value = '';
  const r = await fetch('/api/watch', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({symbol: sym})});
  render(await r.json());
}
async function unwatch(sym) {
  const r = await fetch('/api/watch/' + encodeURIComponent(sym), {method:'DELETE'});
  render(await r.json());
}
async function reconnect() {
  $('conn').textContent = '连接中…';
  await fetch('/api/reconnect', {method:'POST'});
}
$('addBtn').onclick = addWatch;
$('symInput').addEventListener('keydown', e => { if (e.key === 'Enter') addWatch(); });
$('reconnect').onclick = reconnect;
$('mdtype').addEventListener('change', async (e) => {
  await fetch('/api/market_data_type', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({market_data_type: Number(e.target.value)})});
});

// --- 下单 ---
function orderBody() {
  return {
    symbol: $('oSym').value, quantity: Number($('oQty').value),
    entry_limit: $('oEntry').value,
    tp_kind: $('oTpKind').value, tp_value: $('oTpVal').value,
    sl_kind: $('oSlKind').value, sl_value: $('oSlVal').value, side: 'long',
  };
}
async function postOrder(path) {
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(orderBody())});
  return r.json();
}
function riskHtml(res) {
  if (!res.risk || !res.risk.length) return '';
  const w = res.risk.filter(f => f.severity === 'warn');
  return w.length ? `<div class="err">⚠ ${w.map(f => f.message).join('；')}</div>` : '';
}
function showOrderResult(res, placed) {
  const el = $('orderResult');
  if (res.rejected) { el.innerHTML = `<span class="neg">✕ 拒绝：${res.reason}</span>`; return; }
  const p = res.plan;
  const warn = ((p.warnings && p.warnings.length) ? `<div class="err">⚠ ${p.warnings.join('；')}</div>` : '') + riskHtml(res);
  const head = placed
    ? `<span class="pos">✓ 已下单</span> <span class="mut">(单号 ${res.placement.parent_id}/${res.placement.take_profit_id}/${res.placement.stop_loss_id})</span>`
    : '<span class="mut">预览</span>';
  el.innerHTML = `${head} — 止盈 <b>${p.take_profit}</b> / 止损 <b>${p.stop_loss}</b> /
    金额 ${money(p.notional)} / 扣费净盈亏 <b class="${p.profitable?'pos':'neg'}">${money(p.net_pnl)}</b>${warn}`;
}
async function preview() { showOrderResult(await postOrder('/api/order/preview'), false); }
async function buyLimit() {
  const pr = await postOrder('/api/order/preview');
  if (pr.rejected) { showOrderResult(pr, false); return; }
  const p = pr.plan;
  let msg = (isLive ? '🔴🔴 LIVE 实盘下单！真金白银！🔴🔴\n\n' : '') +
    `确认限价买入 ${p.symbol} ${p.quantity} 股 @ ${p.entry_limit}\n止盈 ${p.take_profit} / 止损 ${p.stop_loss}\n扣费净盈亏 ${p.net_pnl}`;
  if (p.warnings && p.warnings.length) msg += '\n\n⚠ ' + p.warnings.join('\n⚠ ');
  if (!confirm(msg)) return;
  showOrderResult(await postOrder('/api/order/limit'), true);
}
$('previewBtn').onclick = preview;
$('buyBtn').onclick = buyLimit;

// --- 市价买入（模式A：成交后用真实成交价挂止盈止损）---
function marketBody() {
  return {
    symbol: $('oSym').value, quantity: Number($('oQty').value),
    ref_price: $('oEntry').value,
    tp_kind: $('oTpKind').value, tp_value: $('oTpVal').value,
    sl_kind: $('oSlKind').value, sl_value: $('oSlVal').value, side: 'long',
  };
}
async function postMarket(path) {
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(marketBody())});
  return r.json();
}
function showMarketResult(res) {
  const el = $('orderResult');
  if (res.protection_failed) {
    const f = res.flatten || {};
    const flatMsg = f.failed
      ? `<b>⚠ 紧急平仓下单也失败，可能裸仓——立即手动平仓！</b>`
      : (f.flatten_order_id && f.quantity > 0)
        ? `已紧急平仓 ${f.quantity} 股（单号 ${f.flatten_order_id}）`
        : `<b>未能确认平仓，请立即手动检查持仓！</b>`;
    el.innerHTML = `<span class="neg">⚠ 保护单失败！</span> 成交 ${res.filled} 股 @ ${res.fill_price} — ${flatMsg}。原因：${res.reason}`;
    return;
  }
  if (res.entry_uncertain) {
    el.innerHTML = `<span class="neg">⚠ 入场单状态未知（可能已成交）！请立即检查持仓与挂单。</span> ${res.reason}`;
    return;
  }
  if (res.rejected) { el.innerHTML = `<span class="neg">✕ 拒绝：${res.reason}</span>`; return; }
  const pl = res.placement;
  if (!pl) { el.innerHTML = `<span class="neg">✕ 异常响应，请检查持仓</span>`; return; }
  // 时段外：市价已转激进限价 bracket（返回限价 bracket 形态）
  if (res.converted_to_limit) {
    const p = res.plan;
    el.innerHTML = `<span class="pos">✓ 时段外已挂激进限价 bracket</span>（市价时段外不可用）—
      限价 <b>${pl.entry_limit}</b> / 止盈 <b>${pl.take_profit}</b> /
      止损 <b>${pl.stop_loss}</b>${pl.stop_limit ? ' (stop-limit '+pl.stop_limit+')' : ''}
      <span class="mut">outsideRth · 单号 ${pl.parent_id}/${pl.take_profit_id}/${pl.stop_loss_id}</span>${riskHtml(res)}`;
    return;
  }
  if (pl.filled === 0) { el.innerHTML = `<span class="mut">市价单未成交（${pl.message||''}）</span>`; return; }
  el.innerHTML = `<span class="pos">✓ 市价成交</span> ${pl.filled} 股 @ <b>${pl.fill_price}</b> —
    止盈 <b>${pl.take_profit}</b> / 止损 <b>${pl.stop_loss}</b>
    <span class="mut">(OCA ${pl.oca_group})</span>${riskHtml(res)}`;
}
async function buyMarket() {
  const pr = await postMarket('/api/order/market/preview');
  if (pr.rejected) { showOrderResult(pr, false); return; }
  const p = pr.plan;
  let msg = (isLive ? '🔴🔴 LIVE 实盘下单！真金白银！🔴🔴\n\n' : '') +
    `确认【市价买入】${p.symbol} ${p.quantity} 股（约 @ ${p.ref_price}）\n` +
    `成交后按真实成交价挂止盈止损（预览：止盈 ${p.preview_take_profit} / 止损 ${p.preview_stop_loss}）`;
  if (!isRth) msg += `\n\n⏰ 当前为${sessionLabel}（时段外）：市价不可用，将自动转为「激进限价 bracket」，止损用 stop-limit。`;
  if (p.warnings && p.warnings.length) msg += '\n\n⚠ ' + p.warnings.join('\n⚠ ');
  if (!confirm(msg)) return;
  showMarketResult(await postMarket('/api/order/market'));
}
$('buyMktBtn').onclick = buyMarket;

// --- 撤单 / 全平 ---
async function cancelAll() {
  if (!confirm('撤销全部挂单？')) return;
  const d = await (await fetch('/api/cancel_all', {method:'POST'})).json();
  $('err').textContent = d.ok ? '✓ 已撤全部挂单' : ('撤单失败: ' + d.reason);
}
async function flattenAll() {
  if (!confirm('⚠ 市价平掉全部持仓并撤销全部挂单？\n此操作立即执行，不可撤销！')) return;
  const d = await (await fetch('/api/flatten_all', {method:'POST'})).json();
  $('err').textContent = d.ok ? `✓ 已撤单并平 ${d.flattened.length} 个持仓` : ('全平失败: ' + d.reason);
}
$('cancelAllBtn').onclick = cancelAll;
$('flattenBtn').onclick = flattenAll;

// --- 键盘热键：b 市价 / l 限价 / f 全平 / c 撤单（焦点在输入框时不触发）---
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'b') buyMarket();
  else if (k === 'l') buyLimit();
  else if (k === 'f') flattenAll();
  else if (k === 'c') cancelAll();
});

// WebSocket 实时推送
let ws;
function connectWS() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = (e) => render(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connectWS, 1000);
}
connectWS();
fetch('/api/state').then(r => r.json()).then(render);
</script>
</body>
</html>
